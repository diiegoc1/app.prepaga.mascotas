<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VetCare - Configuración</title>

  <!-- Hojas de Estilo -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/configuracion.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase & JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/compartido/supabaseClient.js"></script>
  <script src="js/compartido/sesion.js"></script>
  <script type="module" src="js/configuracion.js"></script>
</head>
<body>

  <!-- SIDEBAR COMPARTIDO -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">🐾</div>
      <div class="brand-text">
        <div class="name">VetCare</div>
        <div class="tag">GESTIÓN VETERINARIA</div>
      </div>
    </div>

    <nav>
      <a href="dashboard.html" class="nav-item">
        <i data-lucide="house"></i>
        Dashboard
      </a>
      <a href="clientes.html" class="nav-item">
        <i data-lucide="users"></i>
        Clientes
      </a>
      <a href="mascotas.html" class="nav-item">
        <i data-lucide="paw-print" class="paw-icon"></i>
        Mascotas
      </a>
      <a href="planes.html" class="nav-item">
        <i data-lucide="shield-check"></i>
        Planes
      </a>
      <a href="historial.html" class="nav-item">
        <i data-lucide="clipboard-list"></i>
        Registro/Historial
      </a>
      <a href="usuarios.html" class="nav-item" data-rol="admin,recepcionista">
        <i data-lucide="user-round"></i>
        Usuarios
      </a>
      <a href="configuracion.html" class="nav-item active">
        <i data-lucide="settings"></i>
        Configuración
      </a>
    </nav>

    <a id="logoutBtn" class="logout">
      <i data-lucide="log-out"></i>
      Cerrar sesión
    </a>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    
    <!-- HEADER -->
    <header class="config-header">
      <div class="header-title">
        <div class="header-icon"><i data-lucide="settings"></i></div>
        <div>
          <h2>Configuración</h2>
          <p>Administra los empleados y usuarios del sistema</p>
        </div>
      </div>

      <div class="theme-toggle">
        <span>Modo claro/oscuro</span>
        <label class="switch">
          <input type="checkbox" id="themeSwitch">
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- GRID DOS COLUMNAS -->
    <section class="config-grid">
      
      <!-- FORMULARIO CREAR USUARIO / EMPLEADO -->
      <div class="card form-card">
        <div class="card-title">
          <i data-lucide="user-plus"></i>
          <h3>Crear empleado</h3>
        </div>

        <form id="createAdminForm" data-rol="admin">
          <div class="form-group">
            <label for="usernameInput">Usuario / Nombre Empleado</label>
            <div class="input-icon-wrapper">
              <i data-lucide="user"></i>
              <input type="text" id="usernameInput" placeholder="Ingrese nombre de usuario" required>
            </div>
          </div>

          <!-- CAMPO EMAIL AGREGADO -->
          <div class="form-group">
            <label for="emailInput">Correo Electrónico</label>
            <div class="input-icon-wrapper">
              <i data-lucide="mail"></i>
              <input type="email" id="emailInput" placeholder="ejemplo@correo.com" required>
            </div>
          </div>

          <div class="form-group">
            <label for="passwordInput">Contraseña</label>
            <div class="input-icon-wrapper">
              <i data-lucide="lock"></i>
              <input type="password" id="passwordInput" placeholder="Ingrese contraseña" required>
              <button type="button" class="toggle-password" id="togglePasswordBtn">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <!-- SELECT DE ROL AGREGADO (REEMPLAZA AL CHECKBOX DE ADM) -->
          <div class="form-group">
            <label for="roleSelect">Rol del Usuario</label>
            <div class="input-icon-wrapper">
              <i data-lucide="shield"></i> <!-- Ícono a la izquierda -->
              <select id="roleSelect">
                <option value="Usuario">Usuario / Operador</option>
                <option value="Administrador">Administrador</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn-primary">
            <i data-lucide="user-plus"></i>
            Crear usuario
          </button>
        </form>
      </div>

      <!-- TABLA ELIMINAR/GESTIONAR USUARIO -->
      <div class="card table-card">
        <div class="card-title purple-text">
          <i data-lucide="trash-2"></i>
          <h3>Gestionar empleados</h3>
        </div>

        <div class="table-responsive">
          <table class="users-table">
            <thead>
              <tr>
                <th>Empleado</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Eliminar</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <!-- Carga dinámica mediante configuracion.js -->
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
